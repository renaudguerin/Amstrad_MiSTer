name: Public tree boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published files and links
        run: python3 scripts/ci/check-public-tree.py
      - name: Validate simulation index
        run: python3 sim/select_tests.py --check
