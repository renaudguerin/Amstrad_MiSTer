---
- name: Prepare the UTM VM for Quartus Prime Lite 17.0.2
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Assert the supported guest platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "13"
          - ansible_facts.architecture == "aarch64"
        fail_msg: >-
          This playbook supports the Debian 13 arm64 UTM guest, not
          {{ ansible_facts.distribution }}
          {{ ansible_facts.distribution_version }}
          {{ ansible_facts.architecture }}.

    - name: Read the build user account
      ansible.builtin.getent:
        database: passwd
        key: "{{ quartus_user }}"

    - name: Assert the build user exists
      ansible.builtin.assert:
        that:
          - quartus_user in ansible_facts.getent_passwd
          - ansible_facts.getent_passwd[quartus_user][4] == quartus_user_home
        fail_msg: >-
          Expected guest account {{ quartus_user }} with home
          {{ quartus_user_home }} does not match the live guest.

    - name: Read guest groups
      ansible.builtin.getent:
        database: group

    - name: Find requested groups that exist in the guest
      ansible.builtin.set_fact:
        quartus_existing_user_groups: >-
          {{ quartus_user_desktop_groups |
             select('in', ansible_facts.getent_group.keys()) | list }}
        quartus_missing_user_groups: >-
          {{ quartus_user_desktop_groups |
             reject('in', ansible_facts.getent_group.keys()) | list }}

    - name: Assert all installer-created groups are still available
      ansible.builtin.assert:
        that:
          - quartus_missing_user_groups | length == 0
        fail_msg: >-
          Refusing to restore an incomplete group set. Missing groups:
          {{ quartus_missing_user_groups | join(', ') }}

    - name: Restore the build user's supplementary groups without replacing others
      ansible.builtin.user:
        name: "{{ quartus_user }}"
        groups: "{{ quartus_existing_user_groups }}"
        append: true

    - name: Locate the Rosetta VirtioFS tag
      ansible.builtin.shell: |
        set -o pipefail
        grep -rlx rosetta /sys/fs/virtiofs/*/tag 2>/dev/null | head -n 1
      args:
        executable: /bin/bash
      register: rosetta_tag
      changed_when: false
      check_mode: false

    - name: Assert UTM exposes the Rosetta runtime
      ansible.builtin.assert:
        that:
          - rosetta_tag.stdout | length > 0
        fail_msg: >-
          UTM is not exposing a VirtioFS share tagged 'rosetta'. Shut down the
          VM, enable Rosetta in UTM's Virtualization settings, and boot it again.

    - name: Install native provisioning and build tools
      ansible.builtin.apt:
        name: "{{ quartus_native_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the Rosetta mount point
      ansible.builtin.file:
        path: "{{ rosetta_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Persist the read-only Rosetta mount
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^rosetta\s+'
        line: "rosetta {{ rosetta_mountpoint }} virtiofs ro,nofail 0 0"
        state: present
        create: false

    - name: Check whether the Rosetta runtime is mounted
      ansible.builtin.command:
        argv:
          - /usr/bin/mountpoint
          - --quiet
          - "{{ rosetta_mountpoint }}"
      register: rosetta_mounted
      changed_when: false
      # util-linux mountpoint returns 32 when the path exists but is not a
      # mount point. Preserve every other non-zero code as a real error.
      failed_when: rosetta_mounted.rc not in [0, 32]
      check_mode: false

    - name: Mount the Rosetta runtime
      ansible.builtin.command:
        argv:
          - /usr/bin/mount
          - -t
          - virtiofs
          - -o
          - ro
          - rosetta
          - "{{ rosetta_mountpoint }}"
      when:
        - rosetta_mounted.rc == 32
        - not ansible_check_mode
      changed_when: true

    - name: Check enabled foreign architectures
      ansible.builtin.command:
        argv:
          - /usr/bin/dpkg
          - --print-foreign-architectures
      register: foreign_architectures
      changed_when: false
      check_mode: false

    - name: Enable amd64 multiarch
      ansible.builtin.command:
        argv:
          - /usr/bin/dpkg
          - --add-architecture
          - amd64
      when: "'amd64' not in foreign_architectures.stdout_lines"
      register: add_amd64
      changed_when: add_amd64.rc == 0

    - name: Refresh package indexes after enabling amd64
      ansible.builtin.apt:
        update_cache: true
      when:
        - not ansible_check_mode
        - add_amd64 is changed

    - name: Install the amd64 runtime used by Quartus and the Rosetta probe
      ansible.builtin.apt:
        name: "{{ quartus_amd64_packages }}"
        state: present
      when: >-
        not ansible_check_mode or
        'amd64' in foreign_architectures.stdout_lines

    - name: Explain the first check-mode limitation
      ansible.builtin.debug:
        msg: >-
          amd64 packages are not resolved during the first --check run because
          check mode does not execute dpkg --add-architecture. Run site.yml
          normally, then --check will cover these packages too.
      when:
        - ansible_check_mode
        - "'amd64' not in foreign_architectures.stdout_lines"

    - name: Check whether the Rosetta binfmt definition exists
      ansible.builtin.stat:
        path: /var/lib/binfmts/rosetta
      register: rosetta_binfmt_definition

    - name: Read the existing Rosetta binfmt definition
      ansible.builtin.slurp:
        path: /var/lib/binfmts/rosetta
      register: rosetta_binfmt_definition_data
      when: rosetta_binfmt_definition.stat.exists

    - name: Check whether the Rosetta definition has the intended content
      ansible.builtin.set_fact:
        rosetta_binfmt_definition_matches: >-
          {{ rosetta_binfmt_definition.stat.exists and
             (rosetta_binfmt_definition_data.content | b64decode ==
              rosetta_binfmt_definition_expected) }}

    - name: Install or replace the Rosetta x86_64 ELF definition
      ansible.builtin.command:
        argv:
          - /usr/sbin/update-binfmts
          - --install
          - rosetta
          - "{{ rosetta_mountpoint }}/rosetta"
          - --magic
          - "{{ rosetta_magic }}"
          - --mask
          - "{{ rosetta_mask }}"
          - --credentials
          - "yes"
          - --preserve
          - "yes"
          - --fix-binary
          - "yes"
      when:
        - not rosetta_binfmt_definition_matches
        - not ansible_check_mode
      changed_when: true

    - name: Install the boot-time Rosetta binfmt enabler
      ansible.builtin.template:
        src: rosetta-binfmt.service.j2
        dest: /etc/systemd/system/rosetta-binfmt.service
        owner: root
        group: root
        mode: "0644"
      register: rosetta_binfmt_service

    - name: Enable and start Rosetta after its mount is available
      ansible.builtin.systemd_service:
        name: rosetta-binfmt.service
        enabled: true
        state: started
        daemon_reload: "{{ rosetta_binfmt_service is changed }}"
      when: not ansible_check_mode

    - name: Create the non-root Quartus installation parent
      ansible.builtin.file:
        path: "{{ quartus_install_parent }}"
        state: directory
        owner: "{{ quartus_user }}"
        group: "{{ quartus_user }}"
        mode: "0755"

    - name: Create the private installer staging directory
      ansible.builtin.file:
        path: "{{ quartus_installer_staging_dir }}"
        state: directory
        owner: "{{ quartus_user }}"
        group: "{{ quartus_user }}"
        mode: "0700"

    - name: Install the shared Quartus environment
      ansible.builtin.template:
        src: quartus-env.sh.j2
        dest: /etc/profile.d/quartus-17.0.sh
        owner: root
        group: root
        mode: "0644"

    - name: Install the reproducible Amstrad build command
      ansible.builtin.template:
        src: build-amstrad.j2
        dest: /usr/local/bin/build-amstrad
        owner: root
        group: root
        mode: "0755"
