[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
local_tmp = /tmp/ansible-amstrad-local
# Per-effective-user, so tasks that become the unprivileged build user get their
# own 0700 directory instead of inheriting root's. A shared /tmp path warns and
# can break become_user tasks in post-install.yml and validate.yml.
remote_tmp = ~/.ansible/tmp

[ssh_connection]
pipelining = True
control_path_dir = /tmp/ansible-amstrad-cp
