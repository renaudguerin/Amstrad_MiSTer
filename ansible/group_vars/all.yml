---
# The unprivileged guest account that owns the Quartus installation. Override
# with -e quartus_user=... if your guest uses a different name.
quartus_user: admin
quartus_user_home: /home/{{ quartus_user }}

# The groups assigned by the Debian installer before `usermod -G sudo` replaced
# the supplementary group list. The playbook verifies that every group exists
# before restoring the list with append=true.
quartus_user_desktop_groups:
  - users
  - audio
  - cdrom
  - dip
  - floppy
  - video
  - plugdev
  - netdev
  - sudo

rosetta_mountpoint: /media/rosetta
rosetta_magic: '\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00'
rosetta_mask: '\xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff'
rosetta_binfmt_definition_expected: |
  :
  magic
  0
  {{ rosetta_magic }}
  {{ rosetta_mask }}
  {{ rosetta_mountpoint }}/rosetta

  yes
  yes
  yes
quartus_install_parent: "{{ quartus_user_home }}/intelFPGA_lite"
quartus_install_dir: "{{ quartus_install_parent }}/17.0"
quartus_rootdir: "{{ quartus_install_dir }}/quartus"
quartus_installer_staging_dir: "{{ quartus_user_home }}/quartus-installer-17.0.2"

# These are the minimal Linux artifacts published on Altera's Quartus Prime
# Lite 17.0 archive page. Keep the vendor filenames: the base installer finds
# Cyclone V support beside itself. Downloading the files and accepting their
# terms remain explicit human actions; installer-preflight.yml only verifies
# payloads that are already in the guest.
quartus_installer_artifacts:
  - description: Quartus Prime Lite 17.0 base installer
    filename: QuartusLiteSetup-17.0.0.595-linux.run
    sha1: 99ccfb15962febceba64de2dc9b28c47e5a3b8df
  - description: Cyclone V 17.0 device support
    filename: cyclonev-17.0.0.595.qdz
    sha1: 2198dedb99866f38d43ff6c029d4bd668e2bbb59
  - description: Quartus Prime 17.0 Update 2
    filename: QuartusSetup-17.0.2.602-linux.run
    sha1: cdc0389947ba6d3fb3206ac9840549c9fb38b093

# validate.yml normally validates the provisioned Rosetta foundation even
# before the human installer handoff. Set this true at the final acceptance
# gate so a missing Quartus installation is a hard failure.
quartus_required: false

# Verilator is built from the official source rather than installed from the
# distribution repository. Debian and Ubuntu packages lag the version used by
# local development, and keeping both runners on the same exact release avoids
# simulator-only RTL compatibility edits.
verilator_version: "5.050"
verilator_commit: "848d926ebd4addacacd294dc84e35d9d4ae8078c"
verilator_install_prefix: "/opt/verilator-{{ verilator_version }}"

quartus_native_packages:
  - avahi-daemon
  - autoconf
  - binfmt-support
  - bison
  - build-essential
  - ca-certificates
  - console-setup
  - curl
  - file
  - flex
  - git
  - help2man
  - kbd
  - libfl-dev
  - perl
  - python3
  - rsync
  - tar
  - unzip
  - xauth
  - xz-utils
  - zlib1g-dev

# Quartus 17's self-extracting installer launchers use an old static ELF layout
# that Apple's Linux Rosetta loader rejects with `bss_size overflow`. Invoke
# only those launchers explicitly through QEMU. Do not install the recommended
# qemu-user-binfmt package: Rosetta remains the normal x86_64 handler for the
# installed Quartus tools.
quartus_installer_emulator_package: qemu-user

# The guest publishes itself as <guest_hostname>.local over mDNS so a changing
# DHCP lease never has to be looked up on the console.
guest_hostname: quartus-vm

# UTM's virtual framebuffer reports a large resolution, which makes the default
# 8x16 console font unreadable. Terminus at 16x32 is legible at any UTM display
# size. Console use is only for the interactive Quartus installer and for
# recovery; normal work happens over SSH.
console_font_face: Terminus
console_font_size: 16x32

# Quartus 17's synthesis binaries are x86_64. Debian 13 renamed several
# libraries for the 64-bit time_t transition, hence the t64 package names.
quartus_amd64_packages:
  - hello:amd64
  - libc6:amd64
  - libstdc++6:amd64
  - zlib1g:amd64
  - libbz2-1.0:amd64
  - libcrypt1:amd64
  - libdbus-1-3:amd64
  - libfontconfig1:amd64
  - libfreetype6:amd64
  - libglib2.0-0t64:amd64
  - libgtk2.0-0t64:amd64
  - libgtk-3-0t64:amd64
  - libncurses6:amd64
  - libnsl2:amd64
  - libsm6:amd64
  - libusb-1.0-0:amd64
  - libx11-6:amd64
  - libx11-xcb1:amd64
  - libxext6:amd64
  - libxft2:amd64
  - libxi6:amd64
  - libxrender1:amd64
  - libxtst6:amd64
