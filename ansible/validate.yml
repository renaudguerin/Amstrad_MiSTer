---
- name: Validate the UTM Quartus build VM
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Read the Rosetta binfmt registration
      ansible.builtin.command:
        argv:
          - /usr/sbin/update-binfmts
          - --display
          - rosetta
      register: rosetta_binfmt
      changed_when: false

    - name: Assert Rosetta is registered and enabled
      ansible.builtin.assert:
        that:
          - "'enabled' in rosetta_binfmt.stdout"
          - "rosetta_mountpoint + '/rosetta' in rosetta_binfmt.stdout"

    - name: Read the persisted Rosetta definition
      ansible.builtin.slurp:
        path: /var/lib/binfmts/rosetta
      register: rosetta_definition

    - name: Require the exact Rosetta interpreter, magic, mask, and flags
      ansible.builtin.assert:
        that:
          - >-
            rosetta_definition.content | b64decode ==
            rosetta_binfmt_definition_expected
        fail_msg: >-
          /var/lib/binfmts/rosetta differs from the managed definition. Re-run
          site.yml before validating.

    - name: Read the active kernel Rosetta registration
      ansible.builtin.command:
        argv:
          - /usr/bin/cat
          - /proc/sys/fs/binfmt_misc/rosetta
      register: rosetta_kernel_definition
      changed_when: false

    - name: Require active credentials, preserve-argv0, and fix-binary flags
      ansible.builtin.assert:
        that:
          - "('interpreter ' + rosetta_mountpoint + '/rosetta') in rosetta_kernel_definition.stdout"
          - "rosetta_kernel_definition.stdout is regex('(?ms).*^flags: [A-Z]*C[A-Z]*$.*')"
          - "rosetta_kernel_definition.stdout is regex('(?ms).*^flags: [A-Z]*P[A-Z]*$.*')"
          - "rosetta_kernel_definition.stdout is regex('(?ms).*^flags: [A-Z]*F[A-Z]*$.*')"
        fail_msg: >-
          The active kernel registration lacks the managed interpreter or the
          C/P/F flags. Registration follows:
          {{ rosetta_kernel_definition.stdout }}

    - name: Inspect the amd64 probe executable
      ansible.builtin.command:
        argv:
          - /usr/bin/file
          - /usr/bin/hello
      register: amd64_probe_file
      changed_when: false

    - name: Execute an amd64 program through Rosetta
      ansible.builtin.command:
        argv:
          - /usr/bin/hello
      register: amd64_probe
      changed_when: false

    - name: Assert the Rosetta probe really is x86_64 and ran successfully
      ansible.builtin.assert:
        that:
          - "'x86-64' in amd64_probe_file.stdout"
          - "'Hello, world!' in amd64_probe.stdout"
        fail_msg: >-
          The amd64 probe did not execute through Rosetta.
          file={{ amd64_probe_file.stdout }} output={{ amd64_probe.stdout }}

    - name: Query the provisioned Verilator version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/verilator
          - --version
      register: verilator_version_report
      changed_when: false

    - name: Check the provisioned Verilator source marker
      ansible.builtin.stat:
        path: >-
          {{ verilator_install_prefix }}/.verilator-source-{{ verilator_commit }}
      register: verilator_source_marker

    - name: Inspect the system Verilator link
      ansible.builtin.stat:
        path: /usr/local/bin/verilator
        follow: false
      register: verilator_system_link

    - name: Require the repository's pinned Verilator release
      ansible.builtin.assert:
        that:
          - >-
            verilator_version_report.stdout is match(
            '^Verilator ' + verilator_version + ' ')
          - verilator_source_marker.stat.exists
          - verilator_source_marker.stat.isreg
          - verilator_system_link.stat.islnk
          - >-
            verilator_system_link.stat.lnk_source ==
            verilator_install_prefix + '/bin/verilator'
        fail_msg: >-
          This repository requires Verilator {{ verilator_version }} from
          {{ verilator_commit }}. Reported version:
          {{ verilator_version_report.stdout }}

    - name: Check for Quartus after the manual installer handoff
      ansible.builtin.stat:
        path: "{{ quartus_rootdir }}/bin/quartus_sh"
      register: quartus_sh

    - name: Require Quartus for the final build-VM acceptance gate
      ansible.builtin.assert:
        that:
          - quartus_sh.stat.exists
          - quartus_sh.stat.isreg
          - quartus_sh.stat.executable
        fail_msg: >-
          Quartus is required but {{ quartus_rootdir }}/bin/quartus_sh is not
          an executable file. Complete the human installer handoff and run
          post-install.yml before repeating this validation.
      when: quartus_required | bool

    - name: Query the installed Quartus version as the non-root build user
      ansible.builtin.command:
        argv:
          - "{{ quartus_rootdir }}/bin/quartus_sh"
          - --version
      become_user: "{{ quartus_user }}"
      environment:
        QUARTUS_ROOTDIR: "{{ quartus_rootdir }}"
        QUARTUS_CPUID_BYPASS: "1"
        PATH: "{{ quartus_rootdir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      register: quartus_version
      changed_when: false
      when: quartus_sh.stat.exists

    - name: Require Quartus 17.0.2 when Quartus is installed
      ansible.builtin.assert:
        that:
          - "'Version 17.0.2' in quartus_version.stdout"
        fail_msg: >-
          Quartus runs, but this core requires 17.0.2. Reported version:
          {{ quartus_version.stdout }}
      when: quartus_sh.stat.exists

    - name: Report Quartus state
      ansible.builtin.debug:
        msg: >-
          {{ quartus_version.stdout
             if quartus_sh.stat.exists
             else 'Rosetta is ready, but Quartus is not installed. Complete the human installer handoff in ansible/README.md; use -e quartus_required=true for the final acceptance gate.' }}
